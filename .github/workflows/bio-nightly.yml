# Rebuilds Maisy's link-in-bio pages from her ShopMy shop every night, and on demand (Run workflow).
# If something changed, the new pages are committed to main, which publishes them.
# If ShopMy or a picture could not be read, the run ends red so GitHub emails the repo's owners;
# whatever did build is still published, and a page is never written empty.
name: Rebuild link in bio
on:
  schedule:
    - cron: '30 8 * * *'   # 3:30am New York in winter, 4:30am in summer
  workflow_dispatch:
permissions:
  contents: write
concurrency: bio-nightly
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Build the pages
        id: build
        run: |
          set +e
          python3 tools/bio/build.py | tee build.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish what changed
        if: steps.build.outputs.code == '0' || steps.build.outputs.code == '3'
        run: |
          rm -f build.log
          if [ -z "$(git status --porcelain preview/bio tools/bio/shopmy.json tools/bio/dates.json tools/bio/feed.json tools/bio/channels.json)" ]; then echo "Nothing changed."; exit 0; fi
          git config user.name "bio-rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add preview/bio tools/bio/shopmy.json tools/bio/dates.json tools/bio/feed.json tools/bio/channels.json
          git commit -m "Link in bio: nightly rebuild from ShopMy"
          git push
      - name: Say so if something could not be read
        if: steps.build.outputs.code != '0'
        run: |
          echo "The build reported a problem (exit ${{ steps.build.outputs.code }}). See the Build the pages step."
          exit 1
